name: Daily Full Automation

on:
  push:
    branches:
      - main
  schedule:
    # 18:00 UTC = 01:00 Asia/Bangkok (UTC+7) on the next day.
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  full_automation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      HEADLESS: "true"
      PYTHONUNBUFFERED: "1"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run full suite
        run: |
          pytest tests api_tests e2e_tests \
            --reruns 1 \
            --reruns-delay 3 \
            --html=artifacts/reports/full-report.html \
            --self-contained-html \
            --junitxml=artifacts/reports/junit.xml

      - name: Upload automation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-automation-artifacts
          path: |
            artifacts/reports/
            artifacts/screenshots/
            artifacts/logs/
          if-no-files-found: warn

      - name: Validate SMTP secrets
        id: smtp_check
        if: always()
        shell: bash
        run: |
          if [[ -n "$SMTP_USERNAME" && -n "$SMTP_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "SMTP secrets detected."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing SMTP credentials. Set SMTP_USERNAME and SMTP_PASSWORD in repository secrets."
          fi

      - name: Send email notification
        if: always() && steps.smtp_check.outputs.ready == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "[GitHub Actions] ${{ github.repository }} - ${{ job.status }}"
          to: caovonhatminh09091999@gmail.com
          from: caovonhatminh09091999@gmail.com
          body: |
            Workflow: ${{ github.workflow }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Status: ${{ job.status }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Skip email notification
        if: always() && steps.smtp_check.outputs.ready != 'true'
        run: echo "Email step skipped because SMTP secrets are missing or invalid."
