name: Daily Full Automation

on:
  push:
    branches:
      - main
  schedule:
    # 18:00 UTC = 01:00 Asia/Bangkok (UTC+7) on the next day.
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  full_automation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      HEADLESS: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run full suite
        run: pytest tests api_tests e2e_tests --html=artifacts/reports/full-report.html --self-contained-html

      - name: Upload automation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-automation-artifacts
          path: |
            artifacts/reports/
            artifacts/screenshots/
            artifacts/logs/
          if-no-files-found: warn

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[GitHub Actions] ${{ github.repository }} - ${{ job.status }}"
          to: caovonhatminh09091999@gmail.com
          from: caovonhatminh09091999@gmail.com
          body: |
            Workflow: ${{ github.workflow }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Status: ${{ job.status }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
