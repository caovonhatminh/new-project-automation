[pytest]
addopts = -v --tb=short
testpaths = tests api_tests e2e_tests
python_files = test_*.py
console_output_style = progress
markers =
    smoke: tests smoke quan trong
    regression: tests regression chinh
    api: tests API va integration HTTP
    e2e: end-to-end journey tests
    e2e_smoke: end-to-end smoke journeys
    e2e_regression: broader end-to-end regression journeys
